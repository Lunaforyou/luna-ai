<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luna • AI Companion</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#060811;color:#f4f5ff;font-family:Inter,system-ui,sans-serif;min-height:100vh}body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle at 50% 0,#6e75ff35,transparent 30%),radial-gradient(circle at 10% 90%,#c0449d25,transparent 30%);filter:blur(45px);pointer-events:none}.app{position:relative;max-width:980px;margin:auto;min-height:100vh}.top{height:72px;padding:0 18px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center}.orb{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c2caff 8%,#777cf6 35%,#432b77 70%,#111224);box-shadow:0 0 32px #777cff99}.brand b{font-size:19px}.right{display:flex;gap:8px}.small{font-size:12px;color:#8e96ad}.btn{border:1px solid #ffffff15;background:#ffffff08;color:#fff;border-radius:12px;padding:9px 12px;cursor:pointer}.primary{background:#656cef;border:0}.panel{max-width:760px;margin:0 auto;padding:55px 20px 130px}.center{text-align:center}.center .orb{width:90px;height:90px;margin:auto auto 22px}.h1{font-size:42px;letter-spacing:-1.8px;margin:0 0 10px}.sub{color:#a0a8bf;line-height:1.6}.modes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:24px 0}.mode{border:1px solid #ffffff14;background:#ffffff08;color:#dfe4f6;border-radius:999px;padding:9px 13px;cursor:pointer}.mode.active{background:#656cef;color:white}.auth,.account{display:none;max-width:430px;margin:50px auto;padding:20px}.card{background:#ffffff08;border:1px solid #ffffff12;border-radius:20px;padding:22px}.input{width:100%;padding:12px;margin:7px 0;background:#090c16;border:1px solid #ffffff15;border-radius:12px;color:#fff;outline:0}.messages{display:none}.msg{display:flex;margin:18px 0}.msg.user{justify-content:flex-end}.bubble{max-width:82%;padding:13px 16px;border-radius:18px;line-height:1.55;white-space:pre-wrap}.assistant .bubble{background:#ffffff09;border:1px solid #ffffff12}.user .bubble{background:linear-gradient(135deg,#5d64ef,#8849a6)}.composer{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:min(920px,calc(100% - 25px));display:flex;gap:7px;padding:9px;border:1px solid #ffffff18;background:#111422ed;backdrop-filter:blur(20px);border-radius:20px}.composer textarea{flex:1;background:transparent;color:#fff;border:0;outline:0;resize:none;padding:10px;font:inherit}.hidden{display:none!important}.plans{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.plan{flex:1;min-width:180px;background:#ffffff07;border:1px solid #ffffff12;border-radius:18px;padding:18px}.price{font-size:28px;font-weight:700;margin:10px 0}.mem{margin-top:25px}.memory{display:flex;justify-content:space-between;gap:8px;padding:10px;background:#ffffff06;border-radius:10px;margin:7px 0}
</style></head><body><div class="app">
<header class="top"><div class="brand"><div class="orb"></div><div><b>Luna</b><div class="small">kendine eşlik edecek biri</div></div></div><div class="right"><span id="who" class="small"></span><button id="accountBtn" class="btn hidden" onclick="account()">Hesabım</button><button id="authBtn" class="btn" onclick="auth()">Giriş</button></div></header>
<main id="home" class="panel center"><div class="orb"></div><div class="h1">Yalnız değilsin.</div><p class="sub">Konuşmak, gülmek, biraz flört etmek veya sadece gününü paylaşmak için Luna burada.</p><div class="modes"><button class="mode active" data-mode="chat">🌙 Sohbet</button><button class="mode" data-mode="flirt">😏 Flört</button><button class="mode" data-mode="romantic">❤️ Romantik</button><button class="mode" data-mode="funny">😂 Eğlence</button><button class="mode" data-mode="support">🫂 Yanındayım</button></div><button class="btn primary" onclick="startChat()">Luna ile konuş</button><div id="plans" class="plans"></div></main>
<section id="chat" class="panel messages"></section>
<section id="auth" class="auth"><div class="card"><h2 id="authTitle">Luna'ya giriş</h2><input id="name" class="input" placeholder="Adın"><input id="email" class="input" placeholder="E-posta"><input id="password" class="input" type="password" placeholder="Şifre (en az 8 karakter)"><button class="btn primary" onclick="submitAuth()">Devam et</button><button class="btn" onclick="toggleAuth()">Kayıt / Giriş değiştir</button><p id="authMsg" class="small"></p></div></section>
<section id="account" class="account"><div class="card"><h2>Hesabım</h2><p id="planInfo"></p><h3>🌙 Luna'nın hafızası</h3><div id="memories"></div><input id="memoryInput" class="input" placeholder="Luna'nın hatırlamasını istediğin şey"><button class="btn primary" onclick="saveMemory()">Hafızaya ekle</button><p><button class="btn" onclick="logout()">Çıkış yap</button></p></div></section>
<div id="composer" class="composer hidden"><textarea id="input" rows="1" placeholder="Luna'ya bir şey söyle..." onkeydown="key(event)"></textarea><button class="btn" onclick="voice()">🎙</button><button class="btn primary" onclick="send()">➤</button></div>
</div>
<script>
let user=null,loginMode=true,mode="chat",history=[];
const $=id=>document.getElementById(id);
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode});
async function boot(){let r=await fetch("/api/me");let j=await r.json();if(j.user)setUser(j.user);loadPlans()}
function setUser(u){user=u;$("who").textContent=u.name+" • "+u.plan.toUpperCase();$("authBtn").classList.add("hidden");$("accountBtn").classList.remove("hidden")}
async function loadPlans(){let j=await (await fetch("/api/plans")).json();$("plans").innerHTML=j.plans.map(p=>`<div class="plan"><b>${p.name}</b><div class="price">${p.price?("₺"+p.price+"/ay"):"Ücretsiz"}</div><div class="small">${p.features.join(" • ")}</div></div>`).join("")}
function auth(){hideAll();$("auth").style.display="block"}
function toggleAuth(){loginMode=!loginMode;$("authTitle").textContent=loginMode?"Luna'ya giriş":"Luna'ya katıl"}
async function submitAuth(){let body={email:$("email").value,password:$("password").value,name:$("name").value};let url=loginMode?"/api/login":"/api/register";let r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});let j=await r.json();if(!r.ok){$("authMsg").textContent=j.error;return}setUser(j.user);startChat()}
function hideAll(){["home","chat","auth","account"].forEach(x=>$(x).style.display="none")}
function startChat(){if(!user){auth();return}hideAll();$("chat").style.display="block";$("composer").classList.remove("hidden");history=[];$("chat").innerHTML=""}
function add(t,w){let d=document.createElement("div");d.className="msg "+w;let b=document.createElement("div");b.className="bubble";b.textContent=t;d.appendChild(b);$("chat").appendChild(d);window.scrollTo(0,document.body.scrollHeight);return b}
async function send(){let t=$("input").value.trim();if(!t)return;$("input").value="";add(t,"user");history.push({role:"user",content:t});let b=add("Luna düşünüyor…","assistant");try{let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history,mode})});let j=await r.json();if(!r.ok)throw Error(j.error);b.textContent=j.text;history.push({role:"assistant",content:j.text})}catch(e){b.textContent=e.message||"Bağlantı hatası."}}
function key(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}}
async function account(){hideAll();$("account").style.display="block";let r=await fetch("/api/memories");let j=await r.json();$("planInfo").textContent="Plan: "+user.plan.toUpperCase();$("memories").innerHTML=(j.memories||[]).map(m=>`<div class="memory"><span>${m.content}</span><button class="btn" onclick="delMem(${m.id})">×</button></div>`).join("")||'<span class="small">Henüz hafıza yok.</span>'}
async function saveMemory(){let c=$("memoryInput").value.trim();if(!c)return;await fetch("/api/memories",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content:c})});$("memoryInput").value="";account()}
async function delMem(id){await fetch("/api/memories/"+id,{method:"DELETE"});account()}
async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()}
function voice(){if(!("webkitSpeechRecognition"in window)){alert("Sesli giriş bu tarayıcıda desteklenmiyor.");return}let r=new webkitSpeechRecognition();r.lang="tr-TR";r.onresult=e=>$("input").value=e.results[0][0].transcript;r.start()}
boot()
</script></body></html>
